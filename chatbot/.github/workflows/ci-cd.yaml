name: remote ssh command
on:
  push:
    branches:
      - django-api
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Pull new changes on main branch
        if: github.ref == 'refs/heads/main' || github.base_ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: cd /root/chatbot && git pull

      - name: Pull new changes on other branches
        if: github.ref != 'refs/heads/main' && github.base_ref != 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: cd /root/chatbot_dev && git pull

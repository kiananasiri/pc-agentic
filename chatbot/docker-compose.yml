version: "3.3"

services:
  db:
      image: postgres:latest
      env_file:
        - .env
      environment:
        TZ: Asia/Tehran
      volumes:
        - db_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
        interval: 10s
        timeout: 5s
        retries: 5

  web:
    build: .
    command: /bin/sh -c "python manage.py makemigrations --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - ./media:/code/media
      - ./static:/code/statics
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    depends_on:
      - db
  redis:
    image: redis:6.2-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./cache:/var/lib/redis/data
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A ChatbotBackend worker -l INFO -c 3
    env_file:
      - .env
    volumes:
      - ./media:/code/media
    depends_on:
      - db
  celery_beat:
      build:
        context: .
        dockerfile: Dockerfile
      command: celery -A ChatbotBackend beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
      env_file:
        - .env
      volumes:
        - ./media:/code/media
      depends_on:
        - db

volumes:
  media:
  static:
  db_data: